openapi: 3.2.0
info:
  title: Financial Modeling Prep Insider Trading API
  description: Financial Modeling Prep (FMP) provides financial market data including real-time and historical stock quotes, company fundamentals, financial statements (income, balance sheet, cash flow), insider transactions, earnings, ratios, and economic data. This OpenAPI spec covers a representative subset of the public REST API.
  version: 3.0.0
  contact:
    name: Financial Modeling Prep
    url: https://site.financialmodelingprep.com/
servers:
- url: https://financialmodelingprep.com/api/v3
  description: Financial Modeling Prep v3 API
security:
- apiKeyQuery: []
tags:
- name: Insider Trading
paths:
  /insider-trading:
    get:
      operationId: getInsiderTrading
      summary: Get insider transactions
      parameters:
      - name: symbol
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Insider transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags:
      - Insider Trading
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 40
  securitySchemes:
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
