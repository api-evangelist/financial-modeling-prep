openapi: 3.2.0
info:
  title: Financial Modeling Prep Analyst Estimates Fundamentals API
  description: Financial Modeling Prep (FMP) provides real-time and historical financial data through more than 100 REST endpoints served from the stable base https://financialmodelingprep.com/stable. Coverage includes company financial statements (income statement, balance sheet, cash flow), real-time and historical quotes for stocks, forex, crypto, and commodities, SEC filings, analyst estimates, company fundamentals (profile, key metrics, ratios), and macroeconomic indicators. All requests are authenticated with an API key passed as the `apikey` query parameter. Responses default to JSON and most endpoints also support CSV via the `datatype` parameter. This document models a representative subset of the stable endpoints; see the FMP developer docs for the full catalog. FMP also exposes a real-time WebSocket surface, modeled separately in asyncapi/financialmodelingprep-asyncapi.yml.
  version: stable
  contact:
    name: Financial Modeling Prep
    url: https://site.financialmodelingprep.com
  termsOfService: https://site.financialmodelingprep.com/terms-of-service
servers:
- url: https://financialmodelingprep.com/stable
  description: FMP stable REST base
- url: https://financialmodelingprep.com/api/v3
  description: FMP legacy v3 REST base
security:
- apiKeyQuery: []
tags:
- name: Fundamentals
  description: Company profile plus derived key metrics and ratios.
paths:
  /profile:
    get:
      operationId: getCompanyProfile
      tags:
      - Fundamentals
      summary: Company profile
      description: Returns a company profile - sector, industry, description, market cap, exchange, executives, and identifiers - for a ticker symbol.
      parameters:
      - $ref: '#/components/parameters/symbol'
      responses:
        '200':
          description: The company profile.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /key-metrics:
    get:
      operationId: getKeyMetrics
      tags:
      - Fundamentals
      summary: Key metrics
      description: Returns per-period key financial metrics (per-share values, margins, returns, and other derived measures) for a ticker symbol.
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/period'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A list of key-metric periods.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /ratios:
    get:
      operationId: getFinancialRatios
      tags:
      - Fundamentals
      summary: Financial ratios
      description: Returns per-period financial ratios (liquidity, profitability, leverage, and valuation) for a ticker symbol.
      parameters:
      - $ref: '#/components/parameters/symbol'
      - $ref: '#/components/parameters/period'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: A list of ratio periods.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
components:
  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        default: 100
    symbol:
      name: symbol
      in: query
      required: true
      description: Ticker symbol, e.g. AAPL. Some endpoints accept forex (EURUSD) or crypto (BTCUSD) symbols.
      schema:
        type: string
    period:
      name: period
      in: query
      required: false
      description: Reporting period.
      schema:
        type: string
        enum:
        - annual
        - quarter
        default: annual
  securitySchemes:
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: FMP API key passed as the `apikey` query parameter on every request, e.g. ?apikey=YOUR_API_KEY. Obtain a key from the FMP dashboard.
